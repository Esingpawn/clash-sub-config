mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: safari
dns:
  enable: true
  ipv6: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - https://223.5.5.5/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
proxies:
- name: 在线设备数量超过套餐允许值！
  type: ss
  server: 127.0.0.1
  port: 65535
  cipher: aes-128-gcm
  password: 34bd7c53-4ebe-4c15-b930-e4eb8e96416e
  udp: true
- name: 打开官网获取新订阅链接
  type: ss
  server: 127.0.0.1
  port: 65535
  cipher: aes-128-gcm
  password: 34bd7c53-4ebe-4c15-b930-e4eb8e96416e
  udp: true
- name: 请复制新订阅链接重新导入更新
  type: ss
  server: 127.0.0.1
  port: 65535
  cipher: aes-128-gcm
  password: 34bd7c53-4ebe-4c15-b930-e4eb8e96416e
  udp: true
proxy-groups:
- name: 良心云
  type: select
  proxies:
  - 自动选择
  - 故障转移
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
- name: 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 86400
  tolerance: 100
  proxies:
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
- name: 故障转移
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 7200
  proxies:
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
- name: 流媒体
  type: select
  proxies:
  - 良心云
- name: AI服务
  type: select
  proxies:
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
- name: Telegram
  type: select
  proxies:
  - 良心云
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
- name: 微软服务
  type: select
  proxies:
  - DIRECT
  - 良心云
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
- name: 苹果服务
  type: select
  proxies:
  - DIRECT
  - 良心云
  - 在线设备数量超过套餐允许值！
  - 打开官网获取新订阅链接
  - 请复制新订阅链接重新导入更新
